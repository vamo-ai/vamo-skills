# Checks every pull request and every push to main. A pull request from a fork runs its own
# copy of the scripts, so this workflow holds a read-only token and no secrets.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, so the commit to compare with is there
          fetch-depth: 0
          persist-credentials: false

      - name: Validate skills
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request checks out its merge commit, whose first parent is the base. A push
          # compares with the commit main was at before it, which is all zeros for a branch
          # that was just created.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/validate.py --base 'HEAD^1'
          elif [ -n "${BEFORE//0/}" ]; then
            python3 scripts/validate.py --base "$BEFORE"
          else
            python3 scripts/validate.py
          fi

      - name: Build zips
        run: bash scripts/package.sh
