# Publishes one zip per skill as a GitHub release when a skill changes on main, then asks the
# Vamo website to refresh its copy if a token for that is configured.
name: release

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills.json"

permissions:
  contents: read

# one release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate skills
        run: python3 scripts/validate.py

      - name: Build zips
        run: bash scripts/package.sh

      - name: Write release notes
        run: |
          {
            echo "One zip per skill, each with the skill folder at its top level."
            echo
            jq -r '.skills | to_entries[] | "- **\(.key) \(.value.version)**. \(.value.summary)"' skills.json
            echo
            echo "What changed in each version is in [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md)."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skills-$(date -u +%Y-%m-%d).${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  # A separate job, so the token for the website never shares a runner with the repository's
  # scripts or with write access to it. It runs after the release exists and cannot undo it.
  refresh:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      # "true" when the secret is configured. The step below tests this flag, because a step
      # condition cannot read secrets, and only that step receives the value.
      REFRESH_CONFIGURED: ${{ secrets.SKILLS_REFRESH_TOKEN != '' }}
    steps:
      - name: Ask the website to refresh its copy
        if: env.REFRESH_CONFIGURED == 'true'
        continue-on-error: true
        env:
          REFRESH_URL: https://vamotalent.ai/skills/refresh
          SKILLS_REFRESH_TOKEN: ${{ secrets.SKILLS_REFRESH_TOKEN }}
        run: |
          # The header goes to curl on stdin, so the token is in no command line. Redirects are
          # not followed, so it goes to this host only. The response body is discarded.
          status=$(printf 'Authorization: Bearer %s\n' "$SKILLS_REFRESH_TOKEN" \
            | curl --silent --show-error --proto '=https' --max-time 30 --retry 2 \
                --request POST --header @- --output /dev/null --write-out '%{http_code}' \
                "$REFRESH_URL") || status="no response"
          case "$status" in
            2??) echo "The website accepted the refresh (HTTP $status)." ;;
            *) echo "::warning::The website refresh did not go through ($status). The release is published and the site keeps its current copy." ;;
          esac
